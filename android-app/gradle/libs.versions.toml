[versions]
# Build Tools
agp = "8.7.3"
kotlin = "2.1.0"
google-services = "4.4.3"
crashlytics = "3.0.6"

# Target SDK & Compatibility
compileSdk = "35"
targetSdk = "35"
minSdk = "24"
java = "17"

# Firebase
firebase-bom = "33.7.0"

# AndroidX
androidx-core = "1.15.0"
androidx-appcompat = "1.7.0"
androidx-recyclerview = "1.3.2"
androidx-cardview = "1.0.0"
androidx-constraintlayout = "2.2.0"

# Material Design
material = "1.12.0"

# Networking
retrofit = "2.11.0"
moshi = "1.15.1"
okhttp = "4.12.0"

# Google Services
play-services-maps = "19.0.0"

# Testing
junit = "4.13.2"
androidx-test-ext = "1.2.1"
espresso = "3.6.1"
mockito = "5.14.2"
kotlin-test = "2.1.0"
coroutines-test = "1.9.0"

# Static Analysis
ktlint = "1.3.1"
detekt = "1.23.7"

[libraries]
# Firebase
firebase-bom = { group = "com.google.firebase", name = "firebase-bom", version.ref = "firebase-bom" }
firebase-crashlytics-ktx = { group = "com.google.firebase", name = "firebase-crashlytics-ktx" }
firebase-analytics-ktx = { group = "com.google.firebase", name = "firebase-analytics-ktx" }
firebase-firestore-ktx = { group = "com.google.firebase", name = "firebase-firestore-ktx" }
firebase-auth-ktx = { group = "com.google.firebase", name = "firebase-auth-ktx" }

# AndroidX
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "androidx-core" }
androidx-appcompat = { group = "androidx.appcompat", name = "appcompat", version.ref = "androidx-appcompat" }
androidx-recyclerview = { group = "androidx.recyclerview", name = "recyclerview", version.ref = "androidx-recyclerview" }
androidx-cardview = { group = "androidx.cardview", name = "cardview", version.ref = "androidx-cardview" }
androidx-constraintlayout = { group = "androidx.constraintlayout", name = "constraintlayout", version.ref = "androidx-constraintlayout" }

# Material Design
material = { group = "com.google.android.material", name = "material", version.ref = "material" }

# Networking
retrofit = { group = "com.squareup.retrofit2", name = "retrofit", version.ref = "retrofit" }
retrofit-converter-moshi = { group = "com.squareup.retrofit2", name = "converter-moshi", version.ref = "retrofit" }
moshi-kotlin = { group = "com.squareup.moshi", name = "moshi-kotlin", version.ref = "moshi" }
okhttp-logging-interceptor = { group = "com.squareup.okhttp3", name = "logging-interceptor", version.ref = "okhttp" }

# Google Services
play-services-maps = { group = "com.google.android.gms", name = "play-services-maps", version.ref = "play-services-maps" }

# Testing
junit = { group = "junit", name = "junit", version.ref = "junit" }
androidx-test-ext-junit = { group = "androidx.test.ext", name = "junit", version.ref = "androidx-test-ext" }
espresso-core = { group = "androidx.test.espresso", name = "espresso-core", version.ref = "espresso" }
mockito-core = { group = "org.mockito", name = "mockito-core", version.ref = "mockito" }
kotlin-test = { group = "org.jetbrains.kotlin", name = "kotlin-test", version.ref = "kotlin-test" }
coroutines-test = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-test", version.ref = "coroutines-test" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
google-services = { id = "com.google.gms.google-services", version.ref = "google-services" }
firebase-crashlytics = { id = "com.google.firebase.crashlytics", version.ref = "crashlytics" }
ktlint = { id = "org.jlleitschuh.gradle.ktlint", version = "12.1.1" }
detekt = { id = "io.gitlab.arturbosch.detekt", version.ref = "detekt" }

[bundles]
firebase = ["firebase-crashlytics-ktx", "firebase-analytics-ktx", "firebase-firestore-ktx", "firebase-auth-ktx"]
androidx-ui = ["androidx-core-ktx", "androidx-appcompat", "androidx-recyclerview", "androidx-cardview", "androidx-constraintlayout", "material"]
networking = ["retrofit", "retrofit-converter-moshi", "moshi-kotlin", "okhttp-logging-interceptor"]
testing = ["junit", "mockito-core", "kotlin-test", "coroutines-test"]
testing-android = ["androidx-test-ext-junit", "espresso-core"]
